<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>웹앱 서랍</title>
<meta name="theme-color" content="#ECEEEA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121413" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="웹앱 서랍">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%231B1F1D'/%3E%3Crect x='14' y='14' width='15' height='15' rx='4' fill='%237FC290'/%3E%3Crect x='35' y='14' width='15' height='15' rx='4' fill='%2393A6F6'/%3E%3Crect x='14' y='35' width='15' height='15' rx='4' fill='%2393A6F6'/%3E%3Crect x='35' y='35' width='15' height='15' rx='4' fill='%23D6B06A'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Sans+KR:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: a home-screen drawer — header with account tallies, one toolbar, a dense tile grid of the user's apps */
:root{
  --bg:#ECEEEA; --surface:#F8F9F6; --sunk:#E2E5E0; --ink:#1B1F1D; --muted:#5C6560; --line:#D2D7D1;
  --personal:#3B7A4B; --work:#3452C4; --other:#8C6A2B; --danger:#B3362B; --focus:#3452C4;
  --shadow:0 1px 2px rgba(27,31,29,.06),0 6px 18px -10px rgba(27,31,29,.25);
  --f-display:"Bricolage Grotesque","IBM Plex Sans KR",system-ui,sans-serif;
  --f-body:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#121413; --surface:#1B1E1C; --sunk:#0D0F0E; --ink:#E6EAE5; --muted:#99A29C; --line:#2D332F;
  --personal:#7FC290; --work:#93A6F6; --other:#D6B06A; --danger:#F08A7E; --focus:#93A6F6;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 20px -12px rgba(0,0,0,.7); color-scheme:dark}}

*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 64px}
img{max-width:100%}
[hidden]{display:none!important}
.wrap{max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.mono{font-family:var(--f-mono)}
a{color:inherit}

header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px}
.brand h1{font-family:var(--f-display);font-weight:800;font-size:clamp(30px,5vw,44px);line-height:1;letter-spacing:-.02em;margin:0;text-wrap:balance}
.tally{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;color:var(--muted);font-size:13px}
.tally span{display:inline-flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--c,var(--muted));flex:none;display:inline-block}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;cursor:pointer;font-weight:500;font-size:14px;display:inline-flex;align-items:center;gap:7px;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.primary:hover{opacity:.88}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--sunk)}
.btn.danger{color:var(--danger)}
.btn.danger.arm{background:var(--danger);color:var(--surface);border-color:var(--danger)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn svg{width:16px;height:16px;flex:none}
.btn .cnt{font-family:var(--f-mono);font-size:11px;background:var(--work);color:var(--surface);border-radius:999px;padding:0 6px}

.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;border-top:1px solid var(--line);padding-top:18px}
.tabs{display:flex;flex-wrap:wrap;gap:4px;background:var(--sunk);padding:4px;border-radius:12px}
.tab{border:0;background:transparent;padding:6px 12px;border-radius:9px;cursor:pointer;font-size:14px;display:inline-flex;gap:7px;align-items:center;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow);font-weight:600}
.tab .n{font-family:var(--f-mono);font-size:12px;opacity:.75;font-variant-numeric:tabular-nums}
.tools{display:flex;gap:8px;flex-wrap:wrap;flex:1 1 280px;justify-content:flex-end}
.search{position:relative;flex:1 1 220px;max-width:340px;display:block}
.search input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 34px 8px 12px}
.search kbd{position:absolute;right:9px;top:50%;transform:translateY(-50%);font-family:var(--f-mono);font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:0 5px}
select{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 10px}

.notice{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;font-size:13px;color:var(--muted);background:var(--sunk);border-radius:10px;padding:9px 14px}
.notice b{color:var(--ink);font-weight:600}
.notices{display:grid;gap:8px}
.linkish{border:0;background:none;padding:0;color:var(--ink);text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-size:13px}

.grid{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:12px}
.tile{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:16px;transition:border-color .15s;min-width:0}
.tile:hover{border-color:var(--muted)}
.tile-link{display:flex;flex-direction:column;gap:12px;padding:16px 14px 14px;color:inherit;text-decoration:none;border-radius:16px;height:100%}
.ico{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;flex:none;overflow:hidden;
  font-family:var(--f-display);font-weight:800;font-size:21px;letter-spacing:-.02em;color:#fff;background:var(--ic,#555)}
.ico.emoji{font-size:28px;background:var(--sunk)}
.ico.site{background:var(--sunk)}
.ico.site img{width:62%;height:62%;object-fit:contain}
.ico.image img{width:100%;height:100%;object-fit:cover}
.t-body{display:flex;flex-direction:column;gap:2px;min-width:0}
.t-name{font-weight:600;font-size:15px;line-height:1.3;overflow-wrap:anywhere}
.t-host{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t-foot{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);margin-top:auto;flex-wrap:wrap}
.t-foot .acct{display:inline-flex;align-items:center;gap:5px}
.badge{font-size:11px;border:1px solid var(--line);border-radius:6px;padding:0 6px;color:var(--muted);white-space:nowrap}
.t-ctl{position:absolute;top:10px;right:10px;display:flex;gap:2px}
.icbtn{width:30px;height:30px;border-radius:8px;border:0;background:transparent;color:var(--muted);cursor:pointer;display:grid;place-items:center;opacity:0;transition:opacity .15s}
.icbtn svg{width:16px;height:16px}
.icbtn:hover{background:var(--sunk);color:var(--ink)}
.tile:hover .icbtn,.tile:focus-within .icbtn,.icbtn.on{opacity:1}
.icbtn.on{color:var(--other)}
.icbtn.on svg{fill:currentColor}
@media (hover:none){.icbtn{opacity:1}}

.empty{border:1.5px dashed var(--line);border-radius:18px;padding:32px 24px;display:grid;gap:18px;justify-items:start}
.empty h2{font-family:var(--f-display);font-weight:800;font-size:24px;margin:0;letter-spacing:-.01em}
.steps{margin:0;padding:0;list-style:none;display:grid;gap:12px;max-width:62ch;counter-reset:s}
.steps li{display:grid;grid-template-columns:28px 1fr;gap:10px;color:var(--muted)}
.steps li::before{counter-increment:s;content:counter(s);font-family:var(--f-mono);font-size:12px;width:24px;height:24px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;color:var(--ink)}
.steps b{color:var(--ink);font-weight:600}
.nomatch{color:var(--muted);padding:24px 4px}
.status{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:8px;flex-wrap:wrap}

.scrim{position:fixed;inset:0;background:rgba(10,12,11,.45);display:grid;place-items:center;z-index:50;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:18px;width:min(560px,100%);max-height:100%;overflow:auto;box-shadow:0 30px 60px -20px rgba(0,0,0,.45);display:flex;flex-direction:column}
.modal.wide{width:min(740px,100%)}
.m-head{display:flex;justify-content:space-between;align-items:center;padding:18px 20px 6px;gap:12px}
.m-head h3{font-family:var(--f-display);font-weight:800;font-size:22px;margin:0;letter-spacing:-.01em}
.m-body{padding:10px 20px 6px;display:grid;gap:16px}
.m-foot{padding:14px 20px 18px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;border-top:1px solid var(--line);margin-top:10px;align-items:center}
.m-foot .r{display:flex;gap:8px;margin-left:auto}
.sec{display:grid;gap:12px;padding-top:4px}
.sec+.sec{border-top:1px solid var(--line);padding-top:16px}
.sec h4{margin:0;font-size:12px;letter-spacing:.06em;color:var(--muted);font-weight:600}
.field{display:grid;gap:6px;min-width:0}
.field>span{font-size:12px;font-weight:600;letter-spacing:.04em;color:var(--muted)}
.field input,.field textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 12px;min-width:0}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row3{display:grid;grid-template-columns:1fr 1fr 1.3fr;gap:10px}
@media (max-width:560px){.row,.row3{grid-template-columns:1fr}}
.hint{font-size:12.5px;color:var(--muted);margin:0}
.hint a{text-underline-offset:3px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:7px 12px;cursor:pointer;display:inline-flex;gap:7px;align-items:center;font-size:14px}
.seg button[aria-pressed="true"]{border-color:var(--ink);background:var(--surface);font-weight:600;box-shadow:inset 0 0 0 1px var(--ink)}

.iconed{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:start}
.iconed .ico{width:72px;height:72px;border-radius:18px;font-size:28px}
.iconed .ico.emoji{font-size:40px}
.icopts{display:grid;gap:10px;min-width:0}
.swatches{display:flex;flex-wrap:wrap;gap:6px}
.sw{width:26px;height:26px;border-radius:8px;border:2px solid transparent;cursor:pointer;background:var(--c)}
.sw[aria-pressed="true"]{border-color:var(--ink)}
.icopts input[type=text]{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:7px 10px;width:100%}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}

.group{display:grid;gap:8px}
.ghead{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px;flex-wrap:wrap}
.ghead .hint{font-weight:400}
.repolist{border:1px solid var(--line);border-radius:12px;max-height:280px;overflow:auto}
.repo{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:9px 12px;border-bottom:1px solid var(--line);cursor:pointer}
.repo:last-child{border-bottom:0}
.repo .rn{font-weight:600;font-size:14px;overflow-wrap:anywhere}
.repo .ru{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.repo .rmeta{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.repo>div{min-width:0}
.checks{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--muted)}
.checks label{display:inline-flex;gap:6px;align-items:center;cursor:pointer}
.err{color:var(--danger);font-size:13px;margin:0}
.ok{color:var(--personal);font-size:13px;margin:0}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:10px;font-size:14px;z-index:60;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--ink);animation:sp 0.8s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:420px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.tile-link{padding:14px 12px 12px}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <h1>웹앱 서랍</h1>
      <div class="tally" id="tally"></div>
    </div>
    <div class="acts">
      <button class="btn" id="b-settings" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>설정</button>
      <button class="btn" id="b-import" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>GitHub 동기화<span class="cnt" id="newcnt" hidden></span></button>
      <button class="btn primary" id="b-add" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>링크 추가</button>
    </div>
  </header>

  <div class="toolbar">
    <div class="tabs" role="tablist" id="tabs"></div>
    <div class="tools">
      <label class="search"><input id="q" type="search" placeholder="이름, 주소, 저장소 검색" aria-label="검색" autocomplete="off"><kbd>/</kbd></label>
      <select id="sort" aria-label="정렬">
        <option value="pinned">고정 먼저</option>
        <option value="recent">최근 연 순</option>
        <option value="opens">자주 연 순</option>
        <option value="name">이름 순</option>
        <option value="added">추가한 순</option>
      </select>
    </div>
  </div>

  <div class="notices" id="notice"></div>
  <main id="main"></main>
  <div class="status" id="status"></div>
</div>
<div id="modal-root"></div>

<script>
(function(){
"use strict";
/* ================= 기본값 ================= */
const ACCTS=["personal","work","other"];
const ACOLOR={personal:"var(--personal)",work:"var(--work)",other:"var(--other)"};
const DEF_SETTINGS={personal:{label:"개인",handle:""},work:{label:"업무",handle:""}};
const ICOLORS=["#3B7A4B","#3452C4","#8C6A2B","#B3362B","#6B3FA0","#1F7A80","#C0548A","#3D4A55"];
const LS={data:"wd-data",cfg:"wd-cfg",queue:"wd-queue",sort:"wd-sort",seen:"wd-seen",check:"wd-check"};
const CHECK_EVERY=6*3600e3;

function lsGet(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch{return d}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}
function clone(o){return JSON.parse(JSON.stringify(o))}

const saved=lsGet(LS.data,{});
const S={
  links:new Map((saved.links||[]).map(l=>[l.id,l])),
  settings:Object.assign(clone(DEF_SETTINGS),saved.settings||{}),
  cfg:Object.assign({url:"",key:"",tokens:{}},lsGet(LS.cfg,{})),
  queue:lsGet(LS.queue,[]),
  sync:"local",syncErr:"",sheetUrl:saved.sheetUrl||"",lastSync:0,
  tab:"all",q:"",sort:lsGet(LS.sort,"pinned"),
  newRepos:[]
};
const $=s=>document.querySelector(s);
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function newId(){return "l_"+Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function normUrl(u){u=(u||"").trim();if(!u)return"";if(!/^[a-z][a-z0-9+.-]*:\/\//i.test(u))u="https://"+u;return u}
function hostOf(u){try{const x=new URL(u);const p=x.pathname.replace(/\/$/,"");return x.host+(p&&p!=="/"?p:"")}catch{return u||""}}
function domainOf(u){try{return new URL(u).hostname}catch{return""}}
function safeHref(u){return /^https?:\/\//i.test(u||"")?u:"#"}
function label(a){return a==="other"?"기타":(S.settings[a]?.label||DEF_SETTINGS[a].label)}
function handle(a){return (S.settings[a]?.handle||"").trim()}
function token(a){return (S.cfg.tokens?.[a]||"").trim()}
function connected(){return !!(S.cfg.url&&S.cfg.key)}
function hashColor(s){let h=0;for(const c of String(s||""))h=(h*31+c.charCodeAt(0))>>>0;return ICOLORS[h%ICOLORS.length]}
function mono(name){const t=(name||"?").trim()||"?";const parts=t.split(/[\s\-_.]+/).filter(Boolean);
  if(/^[A-Za-z]/.test(t)&&parts.length>1)return (parts[0][0]+parts[1][0]).toUpperCase();
  return /^[A-Za-z]/.test(t)?t.slice(0,2).replace(/^./,c=>c.toUpperCase()):t.slice(0,1)}
function saveData(){lsSet(LS.data,{settings:S.settings,links:[...S.links.values()],sheetUrl:S.sheetUrl})}

/* ================= 구글 시트 동기화 ================= */
async function api(body){
  let r;
  try{r=await fetch(S.cfg.url,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(Object.assign({},body,{key:S.cfg.key})),redirect:"follow"})}
  catch{throw {error:"network"}}
  let j;try{j=await r.json()}catch{throw {error:"not_json"}}
  if(!j.ok)throw j;
  return j;
}
function apiErr(e){
  const c=e&&e.error;
  if(c==="bad_key")return "연결 키가 맞지 않아요.";
  if(c==="no_key")return "Apps Script에서 setup을 먼저 실행해 주세요.";
  if(c==="busy")return "시트가 다른 저장을 처리하는 중이에요. 잠시 후 다시 시도할게요.";
  if(c==="not_json")return "웹앱 주소가 맞는지 확인해 주세요. 배포 시 액세스를 ‘모든 사용자’로 했는지도 확인해 주세요.";
  if(c==="server")return "시트에서 오류가 났어요: "+(e.message||"");
  return "시트에 연결하지 못했어요. 인터넷 연결과 웹앱 주소를 확인해 주세요.";
}
function applyServer(res){
  const m=new Map((res.links||[]).map(l=>[l.id,l]));
  for(const op of S.queue){if(op.op==="upsert")m.set(op.link.id,op.link);else if(op.op==="delete")m.delete(op.id)}
  S.links=m;
  if(res.settings)S.settings=Object.assign(clone(DEF_SETTINGS),res.settings);
  if(res.sheetUrl)S.sheetUrl=res.sheetUrl;
  saveData();
}
let flushing=false,again=false,ft=null;
function scheduleFlush(ms){clearTimeout(ft);ft=setTimeout(flush,ms??700)}
async function flush(){
  if(!connected()){S.sync="local";renderStatus();return}
  if(flushing){again=true;return}
  flushing=true;
  const ops=S.queue.slice();
  S.sync="syncing";renderStatus();
  try{
    const res=await api({action:"batch",ops});
    S.queue=S.queue.slice(ops.length);lsSet(LS.queue,S.queue);
    applyServer(res);S.sync="ok";S.syncErr="";S.lastSync=Date.now();
  }catch(e){S.sync="error";S.syncErr=apiErr(e)}
  flushing=false;render();
  if(again){again=false;flush()}
  return S.sync==="ok";
}
function enqueue(op){
  saveData();
  if(!connected())return;
  S.queue.push(op);lsSet(LS.queue,S.queue);scheduleFlush();
}
function putLink(l){S.links.set(l.id,l);enqueue({op:"upsert",link:l});render()}
function removeLink(id){S.links.delete(id);enqueue({op:"delete",id});render()}
async function putSettings(st){
  S.settings=st;saveData();render();
  if(!connected())return true;
  try{applyServer(await api({action:"settings",settings:st}));S.sync="ok";render();return true}
  catch(e){S.sync="error";S.syncErr=apiErr(e);render();toast(S.syncErr);return false}
}

/* ================= GitHub ================= */
function parseRepos(arr){
  return arr.filter(r=>r&&r.name).map(r=>{
    const owner=(r.owner&&r.owner.login)||(r.full_name||"").split("/")[0]||"";
    const full=r.full_name||(owner?owner+"/"+r.name:r.name);
    const home=(r.homepage||"").trim();
    let pages="";
    if(r.has_pages&&owner){const o=owner.toLowerCase();pages=r.name.toLowerCase()===o+".github.io"?`https://${o}.github.io/`:`https://${o}.github.io/${r.name}/`}
    return {name:r.name,full,owner,repoUrl:r.html_url||("https://github.com/"+full),deploy:home?normUrl(home):pages,
      priv:!!r.private,fork:!!r.fork,archived:!!r.archived,desc:r.description||"",updated:Date.parse(r.pushed_at||r.updated_at||"")||0};
  }).sort((a,b)=>b.updated-a.updated);
}
async function ghRepos(acct){
  const h=handle(acct),tok=token(acct),out=[];
  for(let p=1;p<=5;p++){
    const url=tok?`https://api.github.com/user/repos?per_page=100&page=${p}&sort=pushed&affiliation=owner,organization_member`
                 :`https://api.github.com/users/${encodeURIComponent(h)}/repos?per_page=100&page=${p}&sort=pushed`;
    const headers={Accept:"application/vnd.github+json"};if(tok)headers.Authorization="Bearer "+tok;
    let r;try{r=await fetch(url,{headers})}catch{throw {status:0}}
    if(!r.ok)throw {status:r.status};
    const arr=await r.json();out.push(...arr);if(arr.length<100)break;
  }
  return {acct,repos:parseRepos(out)};
}
function ghErr(e,a){
  if(e&&e.status===401)return "토큰이 맞지 않거나 만료됐어요. 설정에서 토큰을 확인해 주세요.";
  if(e&&e.status===404)return `@${handle(a)} 계정을 찾지 못했어요. 아이디를 확인해 주세요.`;
  if(e&&(e.status===403||e.status===429))return "GitHub 요청 한도(토큰 없이 시간당 60회)에 걸렸어요. 토큰을 넣거나 1시간 뒤에 다시 해 주세요.";
  return "GitHub에 연결하지 못했어요.";
}
let ghCache=null;
function ghAccts(){return ["personal","work"].filter(a=>handle(a)||token(a))}
async function fetchAllRepos(force){
  if(!force&&ghCache&&Date.now()-ghCache.at<5*60e3)return ghCache.results;
  const results=await Promise.all(ghAccts().map(a=>ghRepos(a).catch(e=>({acct:a,repos:[],error:ghErr(e,a)}))));
  ghCache={at:Date.now(),results};lsSet(LS.check,Date.now());
  computeNew();return results;
}
function existing(r){const f=r.full.toLowerCase();return [...S.links.values()].find(l=>l.repo&&l.repo.toLowerCase()===f)}
function computeNew(){
  if(!ghCache){S.newRepos=[];return}
  const seen=new Set(lsGet(LS.seen,[]));
  S.newRepos=ghCache.results.flatMap(g=>g.repos).filter(r=>r.deploy&&!r.fork&&!r.archived&&!seen.has(r.full)&&!existing(r));
}
function markSeen(){if(!ghCache)return;const seen=new Set(lsGet(LS.seen,[]));ghCache.results.forEach(g=>g.repos.forEach(r=>seen.add(r.full)));lsSet(LS.seen,[...seen]);computeNew();render()}
async function autoCheck(){
  if(!ghAccts().length)return;
  if(Date.now()-lsGet(LS.check,0)<CHECK_EVERY)return;
  try{await fetchAllRepos(true);render()}catch{}
}
function prettyName(n){return n.replace(/\.github\.io$/i,"").replace(/[-_]+/g," ").replace(/\b[a-z]/g,c=>c.toUpperCase())}

function visible(){
  let arr=[...S.links.values()];
  if(S.tab!=="all")arr=arr.filter(l=>(l.account||"other")===S.tab);
  const q=S.q.trim().toLowerCase();
  if(q)arr=arr.filter(l=>[l.name,l.url,l.note,l.repo].some(x=>(x||"").toLowerCase().includes(q)));
  const byName=(a,b)=>(a.name||"").localeCompare(b.name||"","ko");
  const s=S.sort;
  return arr.sort((a,b)=>{
    if(s==="pinned"&&!!b.pinned!==!!a.pinned)return b.pinned?1:-1;
    if(s==="recent")return (b.lastOpenedAt||0)-(a.lastOpenedAt||0)||byName(a,b);
    if(s==="opens")return (b.opens||0)-(a.opens||0)||byName(a,b);
    if(s==="added")return (b.createdAt||0)-(a.createdAt||0);
    return byName(a,b);
  });
}
function icoHTML(l){

  const txt=(ic.type==="mono"&&ic.value)?ic.value:m;
  return `<span class="ico" style="--ic:${esc(col)}">${esc(txt)}</span>`;
}

    const nx=Object.assign({},l,{opens:(l.opens||0)+1,lastOpenedAt:Date.now()});
    S.links.set(l.id,nx);enqueue({op:"upsert",link:nx});setTimeout(render,300);return}

  m.addEventListener("paste",e=>{const f=[...(e.clipboardData?.files||[])].find(x=>x.type.startsWith("image/"));if(f){e.preventDefault();takeImage(f)}});
  m.querySelectorAll("#ed-ictype button").forEach(b=>b.addEventListener("click",()=>{if(b.dataset.t!==d.icon.type)setType(b.dataset.t);opts();prev()}));
  m.querySelectorAll("#ed-acct button").forEach(b=>b.addEventListener("click",()=>{d.account=b.dataset.a;m.querySelectorAll("#ed-acct button").forEach(x=>x.setAttribute("aria-pressed",x===b))}));
  m.querySelector("#ed-name").addEventListener("input",prev);
  m.querySelector("#ed-url").addEventListener("change",prev);
  opts();prev();

  const save=()=>{
    const err=m.querySelector("#ed-err");readForm();
    d.name=d.name.trim();d.note=m.querySelector("#ed-note").value.trim();
    if(!d.name){err.textContent="이름을 적어 주세요.";err.hidden=false;return}
    try{new URL(d.url)}catch{err.textContent="주소를 확인해 주세요. 예: https://myapp.vercel.app";err.hidden=false;return}
    if((d.icon.type==="emoji"||d.icon.type==="image")&&!d.icon.value)d.icon={type:"auto"};
    putLink(d);closeModal();toast(isNew?"추가했어요.":"저장했어요.");
  };
  m.querySelector("#ed-save").addEventListener("click",save);
  m.querySelector("#ed").addEventListener("submit",e=>{e.preventDefault();save()});
  m.querySelectorAll("#ed-name,#ed-url,#ed-note").forEach(i=>i.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();save()}}));
  const del=m.querySelector("#ed-del");
  if(del)del.addEventListener("click",()=>{
    if(!del.classList.contains("arm")){del.classList.add("arm");del.textContent="한 번 더 누르면 삭제";return}
    removeLink(d.id);closeModal();toast("삭제했어요.");
  });
}
function fileToIcon(file){return new Promise((res,rej)=>{
  const url=URL.createObjectURL(file),img=new Image();
  img.onload=()=>{const N=96,c=document.createElement("canvas");c.width=c.height=N;const g=c.getContext("2d");
    const w=img.naturalWidth||N,h=img.naturalHeight||N,s=Math.min(w,h);g.drawImage(img,(w-s)/2,(h-s)/2,s,s,0,0,N,N);
    URL.revokeObjectURL(url);let out=c.toDataURL("image/webp",.85);if(!out.startsWith("data:image/webp"))out=c.toDataURL("image/png");res(out)};
  img.onerror=()=>{URL.revokeObjectURL(url);rej()};img.src=url})}

/* ================= 설정 ================= */
function openSettings(){
  const st=clone(S.settings);
  const m=openModal(`<div class="m-head"><h3>설정</h3>${XBTN}</div>
  <div class="m-body">
    <section class="sec"><h4>GITHUB 계정</h4>
      ${["personal","work"].map(a=>`<div class="row3">
        <label class="field"><span><i class="dot" style="--c:${ACOLOR[a]};margin-right:6px"></i>표시 이름</span><input type="text" id="st-${a}-label" value="${esc(st[a].label)}" maxlength="12"></label>
        <label class="field"><span>GitHub 아이디</span><input type="text" id="st-${a}-handle" class="mono" value="${esc(st[a].handle)}" placeholder="${a==="personal"?"my-name":"my-name-work"}" autocapitalize="off" spellcheck="false"></label>
        <label class="field"><span>토큰 (선택, 비공개 저장소용)</span><input type="password" id="st-${a}-token" class="mono" value="${esc(token(a))}" placeholder="github_pat_…" autocomplete="off"></label></div>`).join("")}
      <p class="hint">토큰은 이 브라우저에만 저장하고 시트로 보내지 않아요. GitHub 설정 → Developer settings → Fine-grained tokens에서 만들고, 저장소 접근은 All repositories, 권한은 Metadata 읽기만 주면 충분해요.</p>
    </section>
    <section class="sec"><h4>구글 시트 연결</h4>
      <label class="field"><span>Apps Script 웹앱 주소</span><input type="url" id="st-url" class="mono" value="${esc(S.cfg.url)}" placeholder="https://script.google.com/macros/s/…/exec" spellcheck="false"></label>
      <label class="field"><span>연결 키</span><input type="password" id="st-key" class="mono" value="${esc(S.cfg.key)}" placeholder="setup 실행 후 나온 키" autocomplete="off"></label>
      <p class="hint" id="st-conn">${connected()?(S.sync==="ok"?"연결되어 있어요.":"연결 정보가 들어 있어요."):"비워 두면 이 브라우저에만 저장해요."}</p>
    </section>
    <section class="sec"><h4>백업</h4>
      <div class="acts"><button class="btn" type="button" id="st-export">백업 파일 내보내기</button><span class="btn filebtn">백업 파일 불러오기<input type="file" id="st-importfile" accept="application/json,.json"></span></div>
      <p class="hint">링크와 계정 이름이 JSON 파일로 저장돼요. 토큰과 연결 키는 넣지 않아요.</p>
    </section>
  </div>
  <div class="m-foot"><div class="r"><button class="btn" type="button" data-close>취소</button><button class="btn primary" type="button" id="st-save">저장</button></div></div>`,true);

  m.querySelector("#st-export").addEventListener("click",()=>{
    const blob=new Blob([JSON.stringify({app:"webapp-drawer",version:1,exportedAt:new Date().toISOString(),settings:S.settings,links:[...S.links.values()]},null,2)],{type:"application/json"});
    const a=document.createElement("a");a.href=URL.createObjectURL(blob);
    const d=new Date();a.download=`웹앱서랍-백업-${d.getFullYear()}${String(d.getMonth()+1).padStart(2,"0")}${String(d.getDate()).padStart(2,"0")}.json`;
    document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);
  });
  m.querySelector("#st-importfile").addEventListener("change",async e=>{
    const f=e.target.files[0];if(!f)return;
    try{const j=JSON.parse(await f.text());const ls=Array.isArray(j)?j:j.links;if(!Array.isArray(ls))throw 0;
      let n=0;for(const l of ls){if(!l||!l.name||!l.url)continue;const x=Object.assign({icon:{type:"auto"},opens:0,pinned:false,createdAt:Date.now()},l);if(!x.id)x.id=newId();S.links.set(x.id,x);enqueue({op:"upsert",link:x});n++}
      if(j.settings){S.settings=Object.assign(clone(DEF_SETTINGS),j.settings);saveData()}
      render();closeModal();toast(`링크 ${n}개를 불러왔어요.`);
    }catch{toast("백업 파일을 읽지 못했어요.")}
  });
  m.querySelector("#st-save").addEventListener("click",async()=>{
    const btn=m.querySelector("#st-save");
    for(const a of ["personal","work"]){
      st[a].label=m.querySelector(`#st-${a}-label`).value.trim()||DEF_SETTINGS[a].label;
      st[a].handle=m.querySelector(`#st-${a}-handle`).value.trim().replace(/^@/,"").replace(/^https?:\/\/github\.com\//i,"").replace(/\/.*/,"");
      S.cfg.tokens[a]=m.querySelector(`#st-${a}-token`).value.trim();
    }
    if(st.personal.label===st.work.label){toast("두 계정의 표시 이름을 다르게 해 주세요.");return}
    const wasConnected=connected();
    const url=m.querySelector("#st-url").value.trim(),key=m.querySelector("#st-key").value.trim();
    if(url&&!/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec$/.test(url)){m.querySelector("#st-conn").innerHTML=`<span class="err">주소는 https://script.google.com/macros/s/…/exec 모양이어야 해요.</span>`;return}
    const changedConn=url!==S.cfg.url||key!==S.cfg.key;
    S.cfg.url=url;S.cfg.key=key;lsSet(LS.cfg,S.cfg);ghCache=null;
    btn.disabled=true;btn.textContent="저장하는 중…";
    if(connected()&&changedConn){
      // 처음 연결할 때는 이 브라우저에 있던 링크를 시트로 올립니다
      if(!wasConnected||!S.queue.length)for(const l of S.links.values())S.queue.push({op:"upsert",link:l});
      lsSet(LS.queue,S.queue);
      S.settings=st;saveData();
      const ok=await flush();
      if(!ok){btn.disabled=false;btn.textContent="저장";m.querySelector("#st-conn").innerHTML=`<span class="err">${esc(S.syncErr)}</span>`;return}
      await putSettings(st);
      closeModal();toast("구글 시트에 연결했어요.");
    }else{
      await putSettings(st);closeModal();toast("저장했어요.");
    }
    autoCheck();
  });
}

/* ================= GitHub 동기화 창 ================= */
function openImport(){
  let groups=null,sel=new Set(),f={deployOnly:true,hideFork:true,hideArch:true};
  const m=openModal(`<div class="m-head"><h3>GitHub 동기화</h3>${XBTN}</div>
  <div class="m-body" id="im-body"></div>
  <div class="m-foot"><button class="btn ghost" type="button" id="im-reload">다시 불러오기</button><p class="hint" id="im-sum"></p><div class="r"><button class="btn" type="button" data-close>닫기</button><button class="btn primary" type="button" id="im-go" disabled>가져오기</button></div></div>`,true);
  const body=m.querySelector("#im-body");

  async function load(force){
    if(!ghAccts().length){
      body.innerHTML=`<p class="hint">먼저 설정에서 GitHub 아이디(또는 토큰)를 적어 주세요. 두 계정을 모두 적으면 한 번에 불러와요.</p><div class="acts"><button class="btn primary" type="button" id="im-toset">설정 열기</button></div>`;
      body.querySelector("#im-toset").addEventListener("click",()=>{closeModal();openSettings()});
      m.querySelector("#im-reload").hidden=true;return;
    }
    body.innerHTML=`<p class="hint" style="display:flex;gap:8px;align-items:center"><span class="spin"></span>저장소 목록을 불러오는 중…</p>`;
    groups=await fetchAllRepos(force);
    sel=new Set();
    groups.forEach(g=>g.repos.forEach(r=>{if(r.deploy&&!r.fork&&!r.archived)sel.add(g.acct+"|"+r.full)}));
    draw();render();
  }
  function shown(g){return g.repos.filter(r=>(!f.deployOnly||r.deploy)&&(!f.hideFork||!r.fork)&&(!f.hideArch||!r.archived))}
  function draw(){
    body.innerHTML=`<div class="checks"><label><input type="checkbox" id="f-dep" ${f.deployOnly?"checked":""}>배포 주소 있는 것만</label><label><input type="checkbox" id="f-fork" ${f.hideFork?"checked":""}>포크 숨기기</label><label><input type="checkbox" id="f-arch" ${f.hideArch?"checked":""}>보관된 저장소 숨기기</label></div>
    ${groups.map(g=>{const v=shown(g);const h=handle(g.acct);return `<div class="group">
      <div class="ghead"><i class="dot" style="--c:${ACOLOR[g.acct]}"></i>${esc(label(g.acct))}${h?` <span class="mono" style="font-weight:400">@${esc(h)}</span>`:""}
        ${g.error?"":`<span class="hint">저장소 ${g.repos.length}개 중 ${v.length}개 표시${token(g.acct)?" · 비공개 포함":" · 공개만"}</span>`}
        ${!g.error&&v.length?`<button class="linkish" type="button" data-all="${g.acct}">모두 선택</button>`:""}</div>
      ${g.error?`<p class="err">${esc(g.error)}</p>`:v.length?`<div class="repolist">${v.map(r=>{const k=g.acct+"|"+r.full,ex=existing(r);return `<label class="repo"><input type="checkbox" data-k="${esc(k)}" ${sel.has(k)?"checked":""}>
        <div><div class="rn">${esc(prettyName(r.name))}</div><div class="ru">${esc(r.deploy?hostOf(r.deploy):"배포 주소 없음 · 저장소 페이지로 연결")}</div></div>
        <span class="rmeta">${r.priv?'<span class="badge">비공개</span>':""}${ex?'<span class="badge">이미 있음 · 갱신</span>':'<span class="badge">새로</span>'}</span></label>`}).join("")}</div>`
        :`<p class="hint">조건에 맞는 저장소가 없어요. 저장소 About의 Website 칸에 배포 주소를 적어 두면 자동으로 잡혀요.</p>`}</div>`}).join("")}`;
    body.querySelector("#f-dep").addEventListener("change",e=>{f.deployOnly=e.target.checked;draw()});
    body.querySelector("#f-fork").addEventListener("change",e=>{f.hideFork=e.target.checked;draw()});
    body.querySelector("#f-arch").addEventListener("change",e=>{f.hideArch=e.target.checked;draw()});
    body.querySelectorAll("[data-all]").forEach(b=>b.addEventListener("click",()=>{const g=groups.find(x=>x.acct===b.dataset.all);const v=shown(g);const all=v.every(r=>sel.has(g.acct+"|"+r.full));v.forEach(r=>all?sel.delete(g.acct+"|"+r.full):sel.add(g.acct+"|"+r.full));draw()}));
    body.querySelectorAll("[data-k]").forEach(c=>c.addEventListener("change",()=>{c.checked?sel.add(c.dataset.k):sel.delete(c.dataset.k);upd()}));
    upd();
  }
  function picked(){const out=[];(groups||[]).forEach(g=>shown(g).forEach(r=>{if(sel.has(g.acct+"|"+r.full))out.push({acct:g.acct,r})}));return out}
  function upd(){const p=picked(),n=p.filter(x=>!existing(x.r)).length,u=p.length-n;
    m.querySelector("#im-sum").textContent=p.length?`새로 ${n}개${u?` · 갱신 ${u}개`:""}`:"";
    const go=m.querySelector("#im-go");go.disabled=!p.length;go.textContent=p.length?`${p.length}개 가져오기`:"가져오기"}
  m.querySelector("#im-reload").addEventListener("click",()=>load(true));
  m.querySelector("#im-go").addEventListener("click",()=>{
    let made=0,upd2=0;
    for(const {acct,r} of picked()){
      const url=r.deploy||r.repoUrl,ex=existing(r);
      if(ex){const nx=Object.assign({},ex,{url,account:acct,note:ex.note||r.desc});if(nx.url!==ex.url||nx.note!==ex.note||nx.account!==ex.account){putLink(nx);upd2++}}
      else{putLink({id:newId(),name:prettyName(r.name),url,note:r.desc,account:acct,repo:r.full,icon:{type:"auto"},pinned:false,opens:0,createdAt:Date.now()});made++}
    }
    markSeen();closeModal();toast(made||upd2?`새로 ${made}개 추가${upd2?`, ${upd2}개 갱신`:""}했어요.`:"바뀐 게 없어요.");
  });
  load(false);
}

/* ================= 시작 ================= */
render();
if(connected())flush().then(autoCheck);else autoCheck();
})();
</script>
