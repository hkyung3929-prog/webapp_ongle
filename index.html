<html lang="ko">
<head>
<meta charset="utf-8">

<title>🐯🐿️ONGLEDONGLE웹앱모음🍒</title>

<meta name="theme-color" content="#121413" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="🐯🐿️ONGLEDONGLE웹앱모음🍒">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%231B1F1D'/%3E%3Crect x='14' y='14' width='15' height='15' rx='4' fill='%23E59A62'/%3E%3Crect x='35' y='14' width='15' height='15' rx='4' fill='%2393A6F6'/%3E%3Crect x='14' y='35' width='15' height='15' rx='4' fill='%237FC290'/%3E%3Crect x='35' y='35' width='15' height='15' rx='4' fill='%2393A6F6'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Sans+KR:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: a drawer of app cards — header with tallies, category tabs, a folder bar for 학교용, then folder sections of cards (thumbnail on top) or a compact icon grid */
:root{
  --bg:#ECEEEA; --surface:#F8F9F6; --sunk:#E2E5E0; --ink:#1B1F1D; --muted:#5C6560; --line:#D2D7D1;
  --school:#3452C4; --personal:#3B7A4B; --danger:#B3362B; --focus:#3452C4; --star:#B7811F;
  --shadow:0 1px 2px rgba(27,31,29,.06),0 6px 18px -10px rgba(27,31,29,.25);
  --f-display:"Bricolage Grotesque","IBM Plex Sans KR",system-ui,sans-serif;
  --f-body:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#121413; --surface:#1B1E1C; --sunk:#0D0F0E; --ink:#E6EAE5; --muted:#99A29C; --line:#2D332F;
  --school:#93A6F6; --personal:#7FC290; --danger:#F08A7E; --focus:#93A6F6; --star:#E2B85A;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 20px -12px rgba(0,0,0,.7); color-scheme:dark}}

*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 64px}
img{max-width:100%}
[hidden]{display:none!important}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.mono{font-family:var(--f-mono)}
a{color:inherit}

header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px}
.brand h1{font-family:var(--f-display);font-weight:800;font-size:clamp(25px,5vw,44px);line-height:1;letter-spacing:-.02em;margin:0;text-wrap:balance}
.tally{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.tally span{display:inline-flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--c,var(--muted));flex:none;display:inline-block}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;cursor:pointer;font-weight:500;font-size:14px;display:inline-flex;align-items:center;gap:7px;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.primary:hover{opacity:.88}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--sunk)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.danger{color:var(--danger)}
.btn.danger.arm{background:var(--danger);color:var(--surface);border-color:var(--danger)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn svg{width:16px;height:16px;flex:none}
.btn .cnt{font-family:var(--f-mono);font-size:11px;background:var(--school);color:var(--surface);border-radius:999px;padding:0 6px}

.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;border-top:1px solid var(--line);padding-top:18px}
.tabs{display:flex;flex-wrap:wrap;gap:4px;background:var(--sunk);padding:4px;border-radius:12px}
.tab{border:0;background:transparent;padding:6px 12px;border-radius:9px;cursor:pointer;font-size:14px;display:inline-flex;gap:7px;align-items:center;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow);font-weight:600}
.tab .n{font-family:var(--f-mono);font-size:12px;opacity:.75;font-variant-numeric:tabular-nums}
.tools{display:flex;gap:8px;flex-wrap:wrap;flex:1 1 300px;justify-content:flex-end;align-items:center}
.search{position:relative;flex:1 1 200px;max-width:320px;display:block}
.search input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 34px 8px 12px}
.search kbd{position:absolute;right:9px;top:50%;transform:translateY(-50%);font-family:var(--f-mono);font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:0 5px}
select{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 10px}
.viewsw{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.viewsw button{border:0;background:transparent;padding:7px 9px;cursor:pointer;color:var(--muted);display:grid;place-items:center}
.viewsw button[aria-pressed="true"]{background:var(--sunk);color:var(--ink)}
.viewsw svg{width:17px;height:17px}

.notices{display:grid;gap:8px}
.notice{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;font-size:13px;color:var(--muted);background:var(--sunk);border-radius:10px;padding:9px 14px}
.notice b{color:var(--ink);font-weight:600}
.linkish{border:0;background:none;padding:0;color:var(--ink);text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-size:13px}

/* ---- icons ---- */
.ico{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;flex:none;overflow:hidden;
  font-family:var(--f-display);font-weight:800;font-size:21px;letter-spacing:-.02em;color:#fff;background:var(--ic,#555)}
.ico.emoji{font-size:28px;background:var(--sunk)}
.ico.site{background:var(--sunk)}
.ico.site img{width:62%;height:62%;object-fit:contain}
.ico.image img{width:100%;height:100%;object-fit:cover}
.ico.sm{width:36px;height:36px;border-radius:10px;font-size:15px}
.ico.sm.emoji{font-size:20px}

/* ---- card view ---- */
.cards{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;min-width:0;transition:border-color .15s}
.card:hover{border-color:var(--muted)}
.c-thumb{display:block;position:relative;aspect-ratio:16/9;max-width:100%;background:color-mix(in srgb,var(--cc) 13%,var(--surface));border-bottom:1px solid var(--line);overflow:hidden}
.c-thumb .panel{position:absolute;inset:0;display:grid;place-items:center}
.c-thumb .panel .ico{width:64px;height:64px;border-radius:18px;font-size:26px;box-shadow:var(--shadow)}
.c-thumb .panel .ico.emoji{font-size:36px;background:var(--surface)}
.c-thumb img.thumb{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top center}
.c-body{display:flex;flex-direction:column;gap:10px;padding:14px 14px 12px;flex:1;min-width:0}
.c-head{display:flex;gap:10px;align-items:center;min-width:0}
.card.nothumb .c-head .ico.sm{display:none}
.c-title{display:flex;flex-direction:column;min-width:0}
.c-name{font-weight:600;font-size:15.5px;line-height:1.3;text-decoration:none;overflow-wrap:anywhere}
.c-name:hover{text-decoration:underline;text-underline-offset:3px}
.t-host{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c-memo{margin:0;font-size:13.5px;color:var(--muted);white-space:pre-line;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.c-links{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12.5px;border:1px solid var(--line);border-radius:999px;padding:2px 10px;text-decoration:none;display:inline-flex;gap:4px;align-items:center;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:var(--bg)}
.chip:hover{border-color:var(--muted)}
.foot{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);margin-top:auto;flex-wrap:wrap}
.foot .cat{display:inline-flex;align-items:center;gap:5px}
.badge{font-size:11px;border:1px solid var(--line);border-radius:6px;padding:0 6px;color:var(--muted);white-space:nowrap}

.ctl{position:absolute;top:8px;right:8px;display:flex;gap:4px}
.icbtn{width:30px;height:30px;border-radius:8px;border:0;background:var(--surface);color:var(--muted);cursor:pointer;display:grid;place-items:center;opacity:0;transition:opacity .15s;box-shadow:var(--shadow)}
.icbtn svg{width:16px;height:16px}
.icbtn:hover{color:var(--ink)}
.card:hover .icbtn,.tile:hover .icbtn,.card:focus-within .icbtn,.tile:focus-within .icbtn,.icbtn.on{opacity:1}
.icbtn.on{color:var(--star)}
.icbtn.on svg{fill:currentColor}
@media (hover:none){.icbtn{opacity:1}}

/* ---- icon view ---- */
.grid{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.tile{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:16px;transition:border-color .15s;min-width:0}
.tile:hover{border-color:var(--muted)}
.tile .icbtn{box-shadow:none;background:transparent}
.tile .icbtn:hover{background:var(--sunk)}
.tile-link{display:flex;flex-direction:column;gap:12px;padding:16px 14px 14px;color:inherit;text-decoration:none;border-radius:16px;height:100%}
.t-name{font-weight:600;font-size:15px;line-height:1.3;overflow-wrap:anywhere}
.t-body{display:flex;flex-direction:column;gap:2px;min-width:0}

.empty{border:1.5px dashed var(--line);border-radius:18px;padding:32px 24px;display:grid;gap:18px;justify-items:start}
.empty h2{font-family:var(--f-display);font-weight:800;font-size:24px;margin:0;letter-spacing:-.01em}
.steps{margin:0;padding:0;list-style:none;display:grid;gap:12px;max-width:62ch;counter-reset:s}
.steps li{display:grid;grid-template-columns:28px 1fr;gap:10px;color:var(--muted)}
.steps li::before{counter-increment:s;content:counter(s);font-family:var(--f-mono);font-size:12px;width:24px;height:24px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;color:var(--ink)}
.steps b{color:var(--ink);font-weight:600}
.nomatch{color:var(--muted);padding:24px 4px}
.status{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:8px;flex-wrap:wrap}

/* ---- modal ---- */
.scrim{position:fixed;inset:0;background:rgba(10,12,11,.45);display:grid;place-items:center;z-index:50;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:18px;width:min(600px,100%);max-height:100%;overflow:auto;box-shadow:0 30px 60px -20px rgba(0,0,0,.45);display:flex;flex-direction:column}
.modal.wide{width:min(760px,100%)}
.m-head{display:flex;justify-content:space-between;align-items:center;padding:18px 20px 6px;gap:12px}
.m-head h3{font-family:var(--f-display);font-weight:800;font-size:22px;margin:0;letter-spacing:-.01em}
.m-body{padding:10px 20px 6px;display:grid;gap:18px}
.m-foot{position:sticky;bottom:0;background:var(--surface);padding:14px 20px 18px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;border-top:1px solid var(--line);margin-top:10px;align-items:center}
.m-foot .r{display:flex;gap:8px;margin-left:auto}
.sec{display:grid;gap:12px}
.sec+.sec{border-top:1px solid var(--line);padding-top:16px}
.sec h4{margin:0;font-size:12px;letter-spacing:.06em;color:var(--muted);font-weight:600}
.field{display:grid;gap:6px;min-width:0}
.field>span,.flabel{font-size:12px;font-weight:600;letter-spacing:.04em;color:var(--muted)}
.field input,.field textarea,.inp{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 12px;min-width:0}
.field textarea{resize:vertical;min-height:76px;line-height:1.55}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.ghrow{display:grid;grid-template-columns:1fr 1.3fr .9fr;gap:10px}
@media (max-width:560px){.row,.row3,.ghrow{grid-template-columns:1fr}}
.hint{font-size:12.5px;color:var(--muted);margin:0}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:7px 12px;cursor:pointer;display:inline-flex;gap:7px;align-items:center;font-size:14px}
.seg button[aria-pressed="true"]{border-color:var(--ink);background:var(--surface);font-weight:600;box-shadow:inset 0 0 0 1px var(--ink)}
.seg.sm button{padding:4px 10px;font-size:13px}

.xlinks{display:grid;gap:8px}
.xl{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.4fr) auto;gap:8px;align-items:center}
@media (max-width:480px){.xl{grid-template-columns:1fr auto}.xl .xl-url{grid-column:1/2}}

.thumbed{display:grid;grid-template-columns:200px 1fr;gap:16px;align-items:start}
@media (max-width:520px){.thumbed{grid-template-columns:1fr}}
.tprev{aspect-ratio:16/9;max-width:100%;border-radius:12px;border:1px solid var(--line);overflow:hidden;position:relative;background:var(--sunk);display:grid;place-items:center;color:var(--muted);font-size:12px}
.tprev img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top center}
.topts{display:grid;gap:10px;min-width:0}

.iconed{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:start}
.iconed .ico{width:64px;height:64px;border-radius:18px;font-size:26px}
.iconed .ico.emoji{font-size:36px}
.icopts{display:grid;gap:10px;min-width:0}
.swatches{display:flex;flex-wrap:wrap;gap:6px}
.sw{width:26px;height:26px;border-radius:8px;border:2px solid transparent;cursor:pointer;background:var(--c)}
.sw[aria-pressed="true"]{border-color:var(--ink)}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}

.group{display:grid;gap:8px}
.ghead{display:flex;align-items:center;gap:8px 10px;font-weight:600;font-size:14px;flex-wrap:wrap}
.ghead .hint{font-weight:400}
.repolist{border:1px solid var(--line);border-radius:12px;max-height:260px;overflow:auto}
.repo{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line)}
.repo .rl{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center;cursor:pointer;min-width:0}
.repo .rl>div{min-width:0}
.rcat{padding:5px 8px;font-size:13px;border-width:1.5px;border-radius:8px;background:var(--bg)}
.repo .badge{display:inline-flex;align-items:center;gap:4px}
.repo:last-child{border-bottom:0}
.repo .rn{font-weight:600;font-size:14px;overflow-wrap:anywhere}
.repo .ru{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.repo .rmeta{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.repo>div{min-width:0}
.checks{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--muted)}
.checks label{display:inline-flex;gap:6px;align-items:center;cursor:pointer}
.err{color:var(--danger);font-size:13px;margin:0}

.fbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:-8px}
.fchip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;cursor:pointer;font-size:13.5px;display:inline-flex;gap:6px;align-items:center}
.fchip svg{width:15px;height:15px;color:var(--school)}
.fchip .n{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.fchip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.fchip[aria-pressed="true"] .n,.fchip[aria-pressed="true"] svg{color:var(--bg)}
.fchip.none{border-style:dashed}
.sections{display:grid;gap:30px}
.fsec{display:grid;gap:12px}
.fsec-h{display:flex;align-items:center;gap:8px 10px;flex-wrap:wrap;padding-bottom:8px;border-bottom:1px solid var(--line)}
.fsec-h svg{width:20px;height:20px;color:var(--school);flex:none}
.fsec-h h2{margin:0;font-size:17px;font-weight:600}
.fsec-h .n{font-family:var(--f-mono);font-size:12.5px;color:var(--muted)}
.fsec-h .linkish{margin-left:auto}
.fsec.none .fsec-h svg{color:var(--muted)}
.fempty{border:1.5px dashed var(--line);border-radius:12px;padding:14px 16px}
.folderline{display:inline-flex;align-items:center;gap:4px}
body.selecting{padding-bottom:110px}
body.selecting .card,body.selecting .tile{cursor:pointer}
body.selecting .ctl{display:none}
.pickmark{position:absolute;top:8px;left:8px;width:26px;height:26px;border-radius:8px;border:2px solid var(--muted);background:var(--surface);display:none;place-items:center;z-index:2}
.pickmark svg{width:16px;height:16px;opacity:0}
body.selecting .pickmark{display:grid}
.picked{outline:2.5px solid var(--school);outline-offset:-1px}
.picked .pickmark{background:var(--school);border-color:var(--school);color:var(--surface)}
.picked .pickmark svg{opacity:1}
.selbar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -10px 30px -18px rgba(0,0,0,.4);
  padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.selbar .in{max-width:1180px;margin:0 auto;display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center}
.selbar b{font-size:14px;min-width:6.5em}
.selbar select,.selbar .inp{padding:6px 10px;font-size:14px;width:auto;max-width:100%}
.selbar .grow{flex:1 1 auto}
.fmgr{display:grid;gap:8px}
.frow{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto auto;gap:6px;align-items:center}
.frow .n{font-family:var(--f-mono);font-size:12px;color:var(--muted);min-width:3.5em;text-align:right}
.frow svg{width:16px;height:16px}
.frow.del .inp{text-decoration:line-through;opacity:.5}
.fadd{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}
.ico.emoji[style*="--eb"],.c-thumb .panel .ico.emoji[style*="--eb"]{background:color-mix(in srgb,var(--eb) 26%,var(--surface))}
.emopick{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.emo{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--bg);cursor:pointer;font-size:19px;display:grid;place-items:center;padding:0}
.emo:hover{border-color:var(--muted)}
.emo.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink);background:var(--surface)}
.emomore summary{cursor:pointer;font-size:12.5px;color:var(--muted);margin-bottom:6px}
.emomore .emopick{max-height:150px;overflow:auto}
.icmk{display:grid;gap:2px;border:1px solid var(--line);border-radius:12px;max-height:56vh;overflow:auto}
.icrow{display:grid;grid-template-columns:auto auto auto auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line)}
.icrow:last-child{border-bottom:0}

function cleanFolder(f){return String(f||"").replace(/[\r\n]+/g," ").trim().slice(0,40)}
function uniq(arr){const o=[];arr.forEach(f=>{f=cleanFolder(f);if(f&&!o.includes(f))o.push(f)});return o}

function normSettings(s){
  const o=clone(DEF_SETTINGS);if(!s)return o;
  if(s.cats)CATS.forEach(c=>{if(s.cats[c]&&s.cats[c].label)o.cats[c].label=s.cats[c].label});
  if(s.gh)SLOTS.forEach(k=>{if(s.gh[k]){o.gh[k].handle=s.gh[k].handle||"";if(CATS.includes(s.gh[k].cat))o.gh[k].cat=s.gh[k].cat}});
  else{if(s.personal&&s.personal.handle)o.gh.a.handle=s.personal.handle;if(s.work&&s.work.handle)o.gh.b.handle=s.work.handle}
  if(Array.isArray(s.folders))o.folders=uniq(s.folders);
  return o;
}
function normLink(l){
  const x=Object.assign({},l);
  const old=x.category||x.account;
  if(!CATS.includes(x.category)){
    x.category=(old==="personal"||old==="other")?"personal":"school";
    /* 예전 버전의 수업용·업무용 분류는 학교용 안의 같은 이름 폴더로 옮깁니다 */
    if(!x.folder&&old==="class")x.folder="수업용";
    if(!x.folder&&old==="work")x.folder="업무용";
  }
  delete x.account;
  x.folder=x.category==="school"?cleanFolder(x.folder):"";
  if(x.memo==null)x.memo=x.note||"";delete x.note;
  if(!Array.isArray(x.links))x.links=[];
  x.thumb=x.thumb||"";
  if(!x.icon)x.icon={type:"auto"};
  return x;
}

function normText(t){return String(t||"").replace(/([a-z])([A-Z])/g,"$1 $2").replace(/[-_./|]+/g," ").toLowerCase()}
function kwHit(text,kw){
  if(/[가-힣]/.test(kw))return text.includes(kw);
  const k=kw.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
  if(kw.length>=4)return text.includes(kw);
  if(kw.length===3)return new RegExp("(^|[^a-z])"+k).test(text);
  return new RegExp("(^|[^a-z])"+k+"([^a-z]|$)").test(text);
}
/* 이름(3점) > 저장소 이름(2점) > 메모(1점)로 점수를 매겨 어울리는 이모지 후보를 돌려줍니다 */
function suggestIcons(l){
  const parts=[[normText(l.name),3],[normText((l.repo||"").split("/")[1]||""),2],[normText(l.memo),1]];
  const scored=[];
  ICON_RULES.forEach((r,i)=>{
    let sc=0,word="";
    for(const kw of r[0]){for(const [t,w] of parts){if(t&&kwHit(t,kw)){if(w>sc||(w===sc&&kw.length>word.length)){sc=Math.max(sc,w);word=kw}}}}
    if(sc)scored.push({i,sc:sc-i/1000,word,emojis:r[1],color:r[2]});
  });
  scored.sort((a,b)=>b.sc-a.sc);
  const out=[],seen=new Set();
  scored.forEach((s,rank)=>s.emojis.forEach((e,j)=>{if(!seen.has(e)&&(rank===0||j===0)){seen.add(e);out.push({emoji:e,color:s.color,word:s.word})}}));
  if(!out.length){const g=["✨","🌟","🧭","🔖","💡","🪄"],h=hashColor(l.name);const st=(h.charCodeAt(2)+h.charCodeAt(4))%g.length;for(let k=0;k<4;k++)out.push({emoji:g[(st+k)%g.length],color:h,word:""})}
  return out.slice(0,6);
}
function autoIcon(l){const s=suggestIcons(l)[0];return {type:"emoji",value:s.emoji,color:s.color}}
function hasLetterIcon(l){const t=(l.icon||{}).type||"auto";return t==="auto"||t==="mono"||t==="site"}
function displayName(l){return (l.name||"").trim()||((l.repo||"").split("/")[1]||"")||hostOf(l.url)||"이름 없음"}

/* ================= 구글 시트 동기화 ================= */
async function api(body){
  let r;
  try{r=await fetch(S.cfg.url,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(Object.assign({},body,{key:S.cfg.key})),redirect:"follow"})}
  catch{throw {error:"network"}}
  let j;try{j=await r.json()}catch{throw {error:"not_json"}}
  if(!j.ok)throw j;
  return j;
}
function apiErr(e){
  const c=e&&e.error;
  if(c==="bad_key")return "연결 키가 맞지 않아요.";
  if(c==="no_key")return "Apps Script에서 setup을 먼저 실행해 주세요.";
  if(c==="busy")return "시트가 다른 저장을 처리하는 중이에요. 잠시 후 다시 시도할게요.";
  if(c==="not_json")return "웹앱 주소가 맞는지, 배포할 때 액세스를 ‘모든 사용자’로 했는지 확인해 주세요.";
  if(c==="server")return "시트에서 오류가 났어요: "+(e.message||"");
  return "시트에 연결하지 못했어요. 인터넷 연결과 웹앱 주소를 확인해 주세요.";
}
function applyServer(res){
  const m=new Map((res.links||[]).map(l=>{const x=normLink(l);return [x.id,x]}));
  for(const op of S.queue){if(op.op==="upsert")m.set(op.link.id,op.link);else if(op.op==="delete")m.delete(op.id)}
  S.links=m;
  if(res.settings){const keep=S.settings.folders;S.settings=normSettings(res.settings);if(pendingSettings)S.settings.folders=keep}
  if(res.sheetUrl)S.sheetUrl=res.sheetUrl;
  saveData();
}
let flushing=false,again=false,ft=null,pendingSettings=0;
function scheduleFlush(ms){clearTimeout(ft);ft=setTimeout(flush,ms??700)}
async function flush(){
  if(!connected()){S.sync="local";renderStatus();return false}
  if(flushing){again=true;return false}
  flushing=true;
  const ops=S.queue.slice();
  S.sync="syncing";renderStatus();
  try{
    const res=await api({action:"batch",ops});
    S.queue=S.queue.slice(ops.length);lsSet(LS.queue,S.queue);
    applyServer(res);S.sync="ok";S.syncErr="";S.lastSync=Date.now();
  }catch(e){S.sync="error";S.syncErr=apiErr(e)}
  flushing=false;render();
  if(again){again=false;flush()}
  return S.sync==="ok";
}
function enqueue(op){
  saveData();
  if(!connected())return;
  S.queue.push(op);lsSet(LS.queue,S.queue);scheduleFlush();
}
function putLink(l,quiet){S.links.set(l.id,l);enqueue({op:"upsert",link:l});if(!quiet)render()}
function removeLink(id){S.links.delete(id);enqueue({op:"delete",id});render()}
async function putSettings(st){
  S.settings=st;saveData();render();
  if(!connected())return true;
  pendingSettings++;
  try{const res=await api({action:"settings",settings:st});pendingSettings--;applyServer(res);S.sync="ok";render();return true}
  catch(e){pendingSettings--;S.sync="error";S.syncErr=apiErr(e);render();toast(S.syncErr);return false}
}
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&connected()&&Date.now()-S.lastSync>60e3)flush()});
window.addEventListener("online",()=>{if(connected())flush()});

/* ================= GitHub ================= */
function parseRepos(arr){
  return arr.filter(r=>r&&r.name).map(r=>{
    const owner=(r.owner&&r.owner.login)||(r.full_name||"").split("/")[0]||"";
    const full=r.full_name||(owner?owner+"/"+r.name:r.name);
    const home=(r.homepage||"").trim();
    let pages="";
    if(r.has_pages&&owner){const o=owner.toLowerCase();pages=r.name.toLowerCase()===o+".github.io"?`https://${o}.github.io/`:`https://${o}.github.io/${r.name}/`}
    return {name:r.name,full,owner,repoUrl:r.html_url||("https://github.com/"+full),deploy:home?normUrl(home):pages,
      priv:!!r.private,fork:!!r.fork,archived:!!r.archived,desc:r.description||"",updated:Date.parse(r.pushed_at||r.updated_at||"")||0};
  }).sort((a,b)=>b.updated-a.updated);
}
async function ghRepos(slot){
  const h=ghHandle(slot),tok=token(slot),out=[];
  for(let p=1;p<=5;p++){
    const url=tok?`https://api.github.com/user/repos?per_page=100&page=${p}&sort=pushed&affiliation=owner,organization_member`
                 :`https://api.github.com/users/${encodeURIComponent(h)}/repos?per_page=100&page=${p}&sort=pushed`;
    const headers={Accept:"application/vnd.github+json"};if(tok)headers.Authorization="Bearer "+tok;
    let r;try{r=await fetch(url,{headers})}catch{throw {status:0}}
    if(!r.ok)throw {status:r.status};
    const arr=await r.json();out.push(...arr);if(arr.length<100)break;
  }
  return {slot,repos:parseRepos(out)};
}
function ghErr(e,k){
  if(e&&e.status===401)return "토큰이 맞지 않거나 만료됐어요. 설정에서 토큰을 확인해 주세요.";
  if(e&&e.status===404)return `@${ghHandle(k)} 계정을 찾지 못했어요. 아이디를 확인해 주세요.`;
  if(e&&(e.status===403||e.status===429))return "GitHub 요청 한도(토큰 없이 시간당 60회)에 걸렸어요. 토큰을 넣거나 1시간 뒤에 다시 해 주세요.";
  return "GitHub에 연결하지 못했어요.";
}
let ghCache=null;
function ghSlots(){return SLOTS.filter(k=>ghHandle(k)||token(k))}
async function fetchAllRepos(force){
  if(!force&&ghCache&&Date.now()-ghCache.at<5*60e3)return ghCache.results;
  const results=await Promise.all(ghSlots().map(k=>ghRepos(k).catch(e=>({slot:k,repos:[],error:ghErr(e,k)}))));
  ghCache={at:Date.now(),results};lsSet(LS.check,Date.now());
  computeNew();return results;
}
function existing(r){const f=r.full.toLowerCase();return [...S.links.values()].find(l=>l.repo&&l.repo.toLowerCase()===f)}
function computeNew(){
  if(!ghCache){S.newRepos=[];return}
  const seen=new Set(lsGet(LS.seen,[]));
  S.newRepos=ghCache.results.flatMap(g=>g.repos).filter(r=>r.deploy&&!r.fork&&!r.archived&&!seen.has(r.full)&&!existing(r));
}
function markSeen(){if(!ghCache)return;const seen=new Set(lsGet(LS.seen,[]));ghCache.results.forEach(g=>g.repos.forEach(r=>seen.add(r.full)));lsSet(LS.seen,[...seen]);computeNew();render()}
async function autoCheck(){
  if(!ghSlots().length)return;
  if(Date.now()-lsGet(LS.check,0)<CHECK_EVERY)return;
  try{await fetchAllRepos(true);render()}catch{}
}

function sortLinks(arr){
  const byName=(a,b)=>(a.name||"").localeCompare(b.name||"","ko");
  const s=S.sort;
  return arr.sort((a,b)=>{
    if(s==="pinned"&&!!b.pinned!==!!a.pinned)return b.pinned?1:-1;
    if(s==="recent")return (b.lastOpenedAt||0)-(a.lastOpenedAt||0)||byName(a,b);
    if(s==="opens")return (b.opens||0)-(a.opens||0)||byName(a,b);
    if(s==="added")return (b.createdAt||0)-(a.createdAt||0);
    return byName(a,b);
  });
}

      :`<p class="hint">아직 폴더가 없어요. 아래에서 만들어 주세요.</p>`;

/* ================= 이미지 처리 ================= */
function loadImg(file){return new Promise((res,rej)=>{const url=URL.createObjectURL(file),img=new Image();img.onload=()=>res({img,url});img.onerror=()=>{URL.revokeObjectURL(url);rej()};img.src=url})}
function drawCover(img,W,H,top){
  const c=document.createElement("canvas");c.width=W;c.height=H;const g=c.getContext("2d");
  const w=img.naturalWidth||W,h=img.naturalHeight||H,s=Math.max(W/w,H/h),sw=W/s,sh=H/s;
  g.fillStyle="#fff";g.fillRect(0,0,W,H);
  g.drawImage(img,(w-sw)/2,top?0:(h-sh)/2,sw,sh,0,0,W,H);return c;
}
function enc(c,q){let o=c.toDataURL("image/webp",q);if(!o.startsWith("data:image/webp"))o=c.toDataURL("image/jpeg",q);return o}
async function fileToIcon(file){const {img,url}=await loadImg(file);const c=drawCover(img,96,96,false);URL.revokeObjectURL(url);return enc(c,.85)}
async function fileToThumb(file,maxChars){
  const {img,url}=await loadImg(file);
  const tries=maxChars?[[640,360,.8],[480,270,.7],[480,270,.55],[320,180,.6],[320,180,.45]]:[[960,540,.85]];
  let out="";
  for(const [W,H,q] of tries){out=enc(drawCover(img,W,H,true),q);if(!maxChars||out.length<=maxChars)break}
  URL.revokeObjectURL(url);
  if(maxChars&&out.length>maxChars)throw new Error("too_big");
  return out;
}

    <div class="row"><label class="field"><span>이름</span><input id="ed-name" type="text" value="${esc(d.name)}" placeholder="예: 3학년 출석부"></label>
    <label class="field"><span>주소</span><input id="ed-url" type="url" class="mono" value="${esc(d.url)}" placeholder="https://…"></label></div>
    <div class="row"><label class="field"><span>넣을 곳</span><select class="inp" id="ed-dest">${destOptions(destVal(),true)}</select></label>
    <label class="field" id="ed-fnew-w" hidden><span>새 폴더 이름</span><input id="ed-fnew" type="text" maxlength="40" placeholder="예: 3학년 2반"></label></div>
    <label class="field"><span>메모</span><textarea id="ed-memo" rows="3" placeholder="무엇에 쓰는 앱인지, 로그인 계정, 주의할 점 등">${esc(d.memo)}</textarea></label>

    <div class="field"><span>썸네일</span>
      <div class="thumbed"><div class="tprev" id="ed-tprev"></div>
        <div class="topts">
          <div class="seg sm" id="ed-tmode">${[["none","없음"],["auto","자동 스크린샷"],["image","이미지"],["url","이미지 주소"]].map(([k,n])=>`<button type="button" data-t="${k}" aria-pressed="${tmode===k}">${n}</button>`).join("")}</div>
          <div id="ed-topt"></div>
        </div></div></div>

    <div class="field"><span>관련 링크</span>
      <div class="xlinks" id="ed-xl"></div>
      <div><button class="btn sm" type="button" id="ed-xadd">+ 링크 더하기</button></div>
      <p class="hint">관리자 페이지, 수업 자료, 저장소처럼 이 앱과 같이 쓰는 주소를 카드 아래에 달아 둬요.</p></div>

    <div class="field"><span>아이콘</span>
      <div class="iconed"><div id="ed-prev"></div>
        <div class="icopts">
          <div class="seg sm" id="ed-ictype">${[["emoji","이모지"],["auto","첫 글자"],["mono","직접 글자"],["site","사이트 아이콘"],["image","이미지"]].map(([k,n])=>`<button type="button" data-t="${k}" aria-pressed="${(d.icon.type||"auto")===k}">${n}</button>`).join("")}</div>
          <div id="ed-icopt"></div>
        </div></div></div>
    ${d.repo?`<p class="hint">연결된 저장소: <a class="mono" href="https://github.com/${esc(d.repo)}" target="_blank" rel="noopener noreferrer">${esc(d.repo)} ↗</a> · GitHub 동기화 때 주소가 갱신돼요.</p>`:""}
    <p class="err" id="ed-err" hidden></p>
  </form>
  <div class="m-foot">${isNew?"":'<button class="btn danger" type="button" id="ed-del">삭제</button>'}<div class="r"><button class="btn" type="button" data-close>취소</button><button class="btn primary" type="button" id="ed-save">${isNew?"추가":"저장"}</button></div></div>`);

  const dsel=m.querySelector("#ed-dest");
  dsel.addEventListener("change",()=>{const nw=dsel.value==="new";m.querySelector("#ed-fnew-w").hidden=!nw;if(nw)m.querySelector("#ed-fnew").focus()});
  const readForm=()=>{d.name=m.querySelector("#ed-name").value;d.url=normUrl(m.querySelector("#ed-url").value)};
  const prev=()=>{readForm();if(autoPick&&d.icon.type==="emoji"){const s0=suggestIcons(d)[0];d.icon.value=s0.emoji;d.icon.color=s0.color}m.querySelector("#ed-prev").innerHTML=icoHTML(d)};

  /* 썸네일 */
  function tprev(){
    const box=m.querySelector("#ed-tprev");readForm();
    if(uploading){box.innerHTML=`<span style="display:flex;gap:8px;align-items:center"><span class="spin"></span>올리는 중…</span>`;return}
    const src=thumbSrc(d);
    box.innerHTML=src?`<img alt="썸네일 미리보기" src="${esc(src)}" referrerpolicy="no-referrer">`:"썸네일 없음";
    const im=box.querySelector("img");if(im)im.onerror=()=>{box.textContent="이미지를 불러오지 못했어요"};
  }
  function topts(){
    const box=m.querySelector("#ed-topt");
    if(tmode==="none")box.innerHTML=`<p class="hint">카드 윗부분에 아이콘이 크게 보여요.</p>`;
    if(tmode==="auto")box.innerHTML=`<p class="hint">주소의 첫 화면을 자동으로 찍어 와요. 처음엔 1분쯤 걸려서 “생성 중” 그림이 보일 수 있어요. 로그인이 필요한 앱은 로그인 화면이 찍혀요.</p>`;
    if(tmode==="image")box.innerHTML=`<div class="acts"><span class="btn sm filebtn">이미지 고르기<input type="file" id="ed-tfile" accept="image/*"></span></div><p class="hint">앱 화면을 캡처해서 이 창에 붙여넣어도(Ctrl/⌘+V) 돼요. 16:9로 잘라서 ${connected()?"구글 드라이브에 저장해요":"이 브라우저에 저장해요"}.</p>`;
    if(tmode==="url")box.innerHTML=`<input type="url" class="inp mono" id="ed-turl" value="${esc(/^https?:/.test(d.thumb)?d.thumb:"")}" placeholder="https://…/screenshot.png" aria-label="이미지 주소">`;
    const fi=box.querySelector("#ed-tfile");if(fi)fi.addEventListener("change",()=>fi.files[0]&&takeThumb(fi.files[0]));
    const ui=box.querySelector("#ed-turl");if(ui)ui.addEventListener("change",()=>{d.thumb=normUrl(ui.value);tprev()});
  }
  function setTmode(t){
    tmode=t;
    if(t==="none")d.thumb="";
    if(t==="auto")d.thumb="auto";
    if((t==="image"&&!/^data:|drive\.google\.com\/thumbnail/.test(d.thumb))||(t==="url"&&!/^https?:/.test(d.thumb)))d.thumb="";
    m.querySelectorAll("#ed-tmode button").forEach(x=>x.setAttribute("aria-pressed",x.dataset.t===t));
    topts();tprev();
  }
  async function takeThumb(file){
    setTmode("image");uploading=true;tprev();setSaving(true);
    try{
      if(connected()){
        try{
          const data=await fileToThumb(file,0);
          const res=await api({action:"upload",name:(d.name||"thumb").trim(),mime:data.slice(5,data.indexOf(";")),data:data.slice(data.indexOf(",")+1)});
          d.thumb=res.url;
        }catch(e){
          d.thumb=await fileToThumb(file,45000);
          toast("드라이브에 올리지 못해서 시트 칸에 작게 저장했어요.");
        }
      }else d.thumb=await fileToThumb(file,45000);
    }catch{toast("이미지를 읽지 못했어요. 다른 파일로 해 보세요.")}
    uploading=false;setSaving(false);tprev();
  }
  m.addEventListener("paste",e=>{const f=[...(e.clipboardData?.files||[])].find(x=>x.type.startsWith("image/"));if(f){e.preventDefault();takeThumb(f)}});
  m.querySelectorAll("#ed-tmode button").forEach(b=>b.addEventListener("click",()=>setTmode(b.dataset.t)));

  /* 관련 링크 */
  function xlDraw(){
    const box=m.querySelector("#ed-xl");
    box.innerHTML=d.links.map((x,i)=>`<div class="xl"><input class="inp" type="text" data-i="${i}" data-f="label" value="${esc(x.label)}" placeholder="이름 (예: 관리자)" aria-label="링크 이름"><input class="inp mono xl-url" type="url" data-i="${i}" data-f="url" value="${esc(x.url)}" placeholder="https://…" aria-label="링크 주소"><button class="btn ghost sm" type="button" data-rm="${i}" aria-label="이 링크 빼기">${XSM}</button></div>`).join("");
    box.querySelectorAll("input").forEach(inp=>inp.addEventListener("input",()=>{d.links[+inp.dataset.i][inp.dataset.f]=inp.value}));
    box.querySelectorAll("[data-rm]").forEach(b=>b.addEventListener("click",()=>{d.links.splice(+b.dataset.rm,1);xlDraw()}));
  }
  m.querySelector("#ed-xadd").addEventListener("click",()=>{d.links.push({label:"",url:""});xlDraw();const ins=m.querySelectorAll("#ed-xl input[data-f=label]");ins[ins.length-1].focus()});

  /* 아이콘 */
  function iopts(){
    const t=d.icon.type||"auto",box=m.querySelector("#ed-icopt");
    const sw=`<div class="swatches">${ICOLORS.map(c=>`<button type="button" class="sw" style="--c:${c}" data-c="${c}" aria-label="색 ${c}" aria-pressed="${(d.icon.color||hashColor(d.name))===c}"></button>`).join("")}</div>`;
    if(t==="auto")box.innerHTML=`<p class="hint">이름 첫 글자로 만들어요. 색을 고를 수 있어요.</p>${sw}`;
    if(t==="site")box.innerHTML=`<p class="hint">주소의 사이트 아이콘(파비콘)을 가져와요.</p>`;
    if(t==="mono")box.innerHTML=`<input type="text" class="inp" id="ed-mono" maxlength="3" value="${esc(d.icon.value||mono(d.name))}" aria-label="아이콘 글자">${sw}`;
    if(t==="emoji"){
      const sug=suggestIcons(d);
      box.innerHTML=`<div class="emopick"><span class="hint">추천</span>${sug.map(s=>`<button type="button" class="emo" data-e="${esc(s.emoji)}" data-c="${esc(s.color)}" title="${esc(s.word?`‘${s.word}’ 보고 고름`:"")}">${s.emoji}</button>`).join("")}</div>
      <details class="emomore"><summary>다른 이모지 고르기</summary><div class="emopick">${PICKER_EMOJI.map(e=>`<button type="button" class="emo" data-e="${e}">${e}</button>`).join("")}</div></details>
      <input type="text" class="inp" id="ed-emoji" maxlength="8" value="${esc(d.icon.value||"")}" placeholder="또는 이모지를 직접 붙여넣기" aria-label="이모지">
      <span class="hint">바탕색</span>${sw}`;
      box.querySelectorAll(".emo").forEach(b=>b.addEventListener("click",()=>{autoPick=false;d.icon.value=b.dataset.e;if(b.dataset.c)d.icon.color=b.dataset.c;iopts();prev()}));
    }
    if(t==="image")box.innerHTML=`<div class="acts"><span class="btn sm filebtn">아이콘 이미지 고르기<input type="file" id="ed-ifile" accept="image/*"></span></div>`;
    box.querySelectorAll(".sw").forEach(b=>b.addEventListener("click",()=>{autoPick=false;d.icon.color=b.dataset.c;iopts();prev()}));
    const mi=box.querySelector("#ed-mono");if(mi)mi.addEventListener("input",()=>{d.icon.value=mi.value;prev()});
    const ei=box.querySelector("#ed-emoji");if(ei)ei.addEventListener("input",()=>{autoPick=false;d.icon.value=ei.value.trim();prev()});
    const fi=box.querySelector("#ed-ifile");if(fi)fi.addEventListener("change",async()=>{if(!fi.files[0])return;try{d.icon={type:"image",value:await fileToIcon(fi.files[0])};prev()}catch{toast("이미지를 읽지 못했어요.")}});
  }
  m.querySelectorAll("#ed-ictype button").forEach(b=>b.addEventListener("click",()=>{
    const t=b.dataset.t;autoPick=false;if(t!==d.icon.type){const col=d.icon.color;d.icon={type:t};if(col&&(t==="auto"||t==="mono"))d.icon.color=col;if(t==="emoji"){const s=suggestIcons(d)[0];d.icon.value=s.emoji;d.icon.color=s.color}}
    m.querySelectorAll("#ed-ictype button").forEach(x=>x.setAttribute("aria-pressed",x===b));iopts();prev()}));
  let sugT;m.querySelector("#ed-name").addEventListener("input",()=>{prev();clearTimeout(sugT);sugT=setTimeout(()=>{if(d.icon.type==="emoji")iopts()},400)});
  m.querySelector("#ed-url").addEventListener("change",()=>{prev();tprev()});
  topts();tprev();xlDraw();iopts();prev();

  function setSaving(on){const b=m.querySelector("#ed-save");if(b)b.disabled=on}
  const save=()=>{
    if(uploading)return;
    const err=m.querySelector("#ed-err");readForm();
    d.name=d.name.trim();d.memo=m.querySelector("#ed-memo").value.trim();
    if(!d.name){err.textContent="이름을 적어 주세요.";err.hidden=false;return}
    try{new URL(d.url)}catch{err.textContent="주소를 확인해 주세요. 예: https://myapp.vercel.app";err.hidden=false;return}
    let dv=dsel.value;
    if(dv==="new"){const nf=cleanFolder(m.querySelector("#ed-fnew").value);if(!nf){err.textContent="새 폴더 이름을 적어 주세요.";err.hidden=false;return}addFolders([nf]);dv="school|"+nf}
    Object.assign(d,parseDest(dv));
    d.links=d.links.map(x=>({label:(x.label||"").trim(),url:normUrl(x.url)})).filter(x=>x.url);
    if(tmode==="url"){const ui=m.querySelector("#ed-turl");if(ui)d.thumb=normUrl(ui.value)}
    if((d.icon.type==="emoji"||d.icon.type==="image")&&!d.icon.value)d.icon={type:"auto"};
    putLink(d);closeModal();toast(isNew?"추가했어요.":"저장했어요.");
  };
  m.querySelector("#ed-save").addEventListener("click",save);
  m.querySelector("#ed").addEventListener("submit",e=>{e.preventDefault();save()});
  m.querySelectorAll("#ed-name,#ed-url,#ed-fnew").forEach(i=>i.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();save()}}));
  const del=m.querySelector("#ed-del");
  if(del)del.addEventListener("click",()=>{
    if(!del.classList.contains("arm")){del.classList.add("arm");del.textContent="한 번 더 누르면 삭제";return}
    removeLink(d.id);closeModal();toast("삭제했어요.");
  });
}

/* ================= 설정 ================= */
function openSettings(){
  const st=clone(S.settings);
  const catOpts=sel=>CATS.map(c=>`<option value="${c}" ${sel===c?"selected":""}>${esc(catLabel(c))}</option>`).join("");
  const m=openModal(`<div class="m-head"><h3>설정</h3>${XBTN}</div>
  <div class="m-body">
    <section class="sec"><h4>분류 이름</h4>
      <div class="row">${CATS.map(c=>`<label class="field"><span><i class="dot" style="--c:${CCOLOR[c]};margin-right:6px"></i>${c==="school"?"폴더로 나누는 분류":"폴더 없는 분류"}</span><input type="text" id="st-cat-${c}" value="${esc(st.cats[c].label)}" maxlength="12"></label>`).join("")}</div>
      <div class="acts"><button class="btn sm" type="button" id="st-icons">아이콘 한꺼번에 만들기</button><button class="btn sm" type="button" id="st-folders">${esc(catLabel("school"))} 폴더 관리 (${folderList().length}개)</button></div>
      <p class="hint">구글 시트의 탭 이름도 같이 바뀌어요.</p>
    </section>
    <section class="sec"><h4>GITHUB 계정</h4>
      ${SLOTS.map((k,i)=>`<div class="ghrow">
        <label class="field"><span>${i?"업무 계정":"개인 계정"} 아이디</span><input type="text" id="st-gh-${k}" class="mono" value="${esc(st.gh[k].handle)}" placeholder="${i?"my-name-work":"my-name"}" autocapitalize="off" spellcheck="false"></label>
        <label class="field"><span>토큰 (선택, 비공개 저장소용)</span><input type="password" id="st-tok-${k}" class="mono" value="${esc(token(k))}" placeholder="github_pat_…" autocomplete="off"></label>
        <label class="field"><span>새 저장소를 담을 곳</span><select id="st-ghcat-${k}">${catOpts(st.gh[k].cat)}</select></label></div>`).join("")}
      <p class="hint">${esc(catLabel("school"))}에 담긴 새 저장소는 ‘폴더 없음’에 들어가요. 폴더는 직접 골라 넣어 주세요. 토큰은 이 브라우저에만 저장하고 시트로 보내지 않아요.</p>
    </section>
    <section class="sec"><h4>구글 시트 연결</h4>
      <label class="field"><span>Apps Script 웹앱 주소</span><input type="url" id="st-url" class="mono" value="${esc(S.cfg.url)}" placeholder="https://script.google.com/macros/s/…/exec" spellcheck="false"></label>
      <label class="field"><span>연결 키</span><input type="password" id="st-key" class="mono" value="${esc(S.cfg.key)}" placeholder="setup 실행 후 나온 키" autocomplete="off"></label>
      <p class="hint" id="st-conn">${connected()?(S.sync==="ok"?"연결되어 있어요.":"연결 정보가 들어 있어요."):"비워 두면 이 브라우저에만 저장해요."}</p>
    </section>
    <section class="sec"><h4>백업</h4>
      <div class="acts"><button class="btn sm" type="button" id="st-export">백업 파일 내보내기</button><span class="btn sm filebtn">백업 파일 불러오기<input type="file" id="st-importfile" accept="application/json,.json"></span></div>
      <p class="hint">링크, 메모, 폴더, 썸네일 주소, 분류 이름이 JSON 파일로 저장돼요. 토큰과 연결 키는 넣지 않아요.</p>
    </section>
  </div>
  <div class="m-foot"><div class="r"><button class="btn" type="button" data-close>취소</button><button class="btn primary" type="button" id="st-save">저장</button></div></div>`,true);

  m.querySelector("#st-folders").addEventListener("click",()=>{closeModal();openFolders()});
  m.querySelector("#st-icons").addEventListener("click",()=>{closeModal();openIconMaker()});
  m.querySelector("#st-export").addEventListener("click",()=>{
    const blob=new Blob([JSON.stringify({app:"ongledongle",version:3,exportedAt:new Date().toISOString(),settings:S.settings,links:[...S.links.values()]},null,2)],{type:"application/json"});
    const a=document.createElement("a");a.href=URL.createObjectURL(blob);
    const d=new Date();a.download=`ONGLEDONGLE-백업-${d.getFullYear()}${String(d.getMonth()+1).padStart(2,"0")}${String(d.getDate()).padStart(2,"0")}.json`;
    document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);
  });
  m.querySelector("#st-importfile").addEventListener("change",async e=>{
    const f=e.target.files[0];if(!f)return;
    try{const j=JSON.parse(await f.text());const ls=Array.isArray(j)?j:j.links;if(!Array.isArray(ls))throw 0;
      let n=0;for(const l of ls){if(!l||!l.name||!l.url)continue;const x=normLink(Object.assign({opens:0,pinned:false,createdAt:Date.now()},l));if(!x.id)x.id=newId();putLink(x,true);n++}
      if(j.settings)await putSettings(normSettings(j.settings));
      render();closeModal();toast(`링크 ${n}개를 불러왔어요.`);
    }catch{toast("백업 파일을 읽지 못했어요.")}
  });
  m.querySelector("#st-save").addEventListener("click",async()=>{
    const btn=m.querySelector("#st-save");
    CATS.forEach(c=>{st.cats[c].label=m.querySelector(`#st-cat-${c}`).value.trim()||DEF_SETTINGS.cats[c].label});
    const labels=CATS.map(c=>st.cats[c].label);
    if(new Set(labels).size<2||labels.includes("설정")){toast("분류 이름은 서로 달라야 하고 ‘설정’은 쓸 수 없어요.");return}
    SLOTS.forEach(k=>{
      st.gh[k].handle=m.querySelector(`#st-gh-${k}`).value.trim().replace(/^@/,"").replace(/^https?:\/\/github\.com\//i,"").replace(/\/.*/,"");
      st.gh[k].cat=m.querySelector(`#st-ghcat-${k}`).value;
      S.cfg.tokens[k]=m.querySelector(`#st-tok-${k}`).value.trim();
    });
    st.folders=S.settings.folders;
    const wasConnected=connected();
    const url=m.querySelector("#st-url").value.trim(),key=m.querySelector("#st-key").value.trim();
    if(url&&!/^https:\/\/script\.google\.com\/(a\/[^/]+\/)?macros\/s\/.+\/exec$/.test(url)){m.querySelector("#st-conn").innerHTML=`<span class="err">주소는 https://script.google.com/macros/s/…/exec 모양이어야 해요.</span>`;return}
    const changedConn=url!==S.cfg.url||key!==S.cfg.key;
    S.cfg.url=url;S.cfg.key=key;lsSet(LS.cfg,S.cfg);ghCache=null;
    btn.disabled=true;btn.textContent="저장하는 중…";
    if(connected()&&changedConn){
      if(!wasConnected||!S.queue.length)for(const l of S.links.values())S.queue.push({op:"upsert",link:l});
      lsSet(LS.queue,S.queue);S.settings=st;saveData();
      const ok=await flush();
      if(!ok){btn.disabled=false;btn.textContent="저장";m.querySelector("#st-conn").innerHTML=`<span class="err">${esc(S.syncErr)}</span>`;return}
      st.folders=uniq(st.folders.concat(S.settings.folders));
      await putSettings(st);closeModal();toast("구글 시트에 연결했어요.");
    }else{await putSettings(st);closeModal();toast("저장했어요.")}
    autoCheck();
  });
}

/* ================= GitHub 동기화 창 ================= */
function openImport(){
  let groups=null,sel=new Set(),dest={},f={deployOnly:true,hideFork:true,hideArch:true};
  const m=openModal(`<div class="m-head"><h3>GitHub 동기화</h3>${XBTN}</div>
  <div class="m-body" id="im-body"></div>
  <div class="m-foot"><button class="btn ghost" type="button" id="im-reload">다시 불러오기</button><p class="hint" id="im-sum"></p><div class="r"><button class="btn" type="button" data-close>닫기</button><button class="btn primary" type="button" id="im-go" disabled>가져오기</button></div></div>`,true);
  const body=m.querySelector("#im-body");
  const key=(g,r)=>g.slot+"|"+r.full;

  async function load(force){
    if(!ghSlots().length){
      body.innerHTML=`<p class="hint">먼저 설정에서 GitHub 아이디(또는 토큰)를 적어 주세요. 두 계정을 모두 적으면 한 번에 불러와요.</p><div class="acts"><button class="btn primary" type="button" id="im-toset">설정 열기</button></div>`;
      body.querySelector("#im-toset").addEventListener("click",()=>{closeModal();openSettings()});
      m.querySelector("#im-reload").hidden=true;return;
    }
    body.innerHTML=`<p class="hint" style="display:flex;gap:8px;align-items:center"><span class="spin"></span>저장소 목록을 불러오는 중…</p>`;
    groups=await fetchAllRepos(force);
    sel=new Set();dest={};
    groups.forEach(g=>g.repos.forEach(r=>{const k=key(g,r);dest[k]=ghCat(g.slot)==="personal"?"personal":"school|";if(r.deploy&&!r.fork&&!r.archived)sel.add(k)}));
    draw();render();
  }
  function shown(g){return g.repos.filter(r=>(!f.deployOnly||r.deploy)&&(!f.hideFork||!r.fork)&&(!f.hideArch||!r.archived))}
  function draw(){
    body.innerHTML=`<div class="checks"><label><input type="checkbox" id="f-dep" ${f.deployOnly?"checked":""}>배포 주소 있는 것만</label><label><input type="checkbox" id="f-fork" ${f.hideFork?"checked":""}>포크 숨기기</label><label><input type="checkbox" id="f-arch" ${f.hideArch?"checked":""}>보관된 저장소 숨기기</label></div>
    <p class="hint">새 저장소는 오른쪽에서 넣을 곳을 바로 고를 수 있어요. 지금 정하지 않으면 ‘폴더 없음’에 들어가니, 나중에 <b>골라서 옮기기</b>로 정리해도 돼요.</p>
    ${groups.map(g=>{const v=shown(g),h=ghHandle(g.slot),fresh=v.filter(r=>!existing(r));return `<div class="group">
      <div class="ghead"><span class="mono">@${esc(h||"토큰 계정")}</span>
        ${g.error?"":`<span class="hint">저장소 ${g.repos.length}개 중 ${v.length}개 표시${token(g.slot)?" · 비공개 포함":" · 공개만"}</span>`}
        ${!g.error&&v.length?`<button class="linkish" type="button" data-all="${g.slot}">모두 선택</button>`:""}
        ${!g.error&&fresh.length>1?`<label class="hint" style="display:inline-flex;gap:6px;align-items:center;margin-left:auto">새 저장소 한꺼번에 <select class="rcat" data-gall="${g.slot}"><option value="">고르기</option>${destOptions("",false)}</select></label>`:""}</div>
      ${g.error?`<p class="err">${esc(g.error)}</p>`:v.length?`<div class="repolist">${v.map(r=>{const k=key(g,r),ex=existing(r);return `<div class="repo">
        <label class="rl"><input type="checkbox" data-k="${esc(k)}" ${sel.has(k)?"checked":""}>
        <div><div class="rn">${esc(prettyName(r.name))}${r.priv?' <span class="badge">비공개</span>':""}</div><div class="ru">${esc(r.deploy?hostOf(r.deploy):"배포 주소 없음 · 저장소 페이지로 연결")}</div></div></label>
        <span class="rmeta">${ex?`<span class="badge"><i class="dot" style="--c:${CCOLOR[ex.category]}"></i> ${esc(placeLabel(ex))}에 있음</span>`:`<select class="rcat" data-rc="${esc(k)}" aria-label="넣을 곳">${destOptions(dest[k],false)}</select>`}</span></div>`}).join("")}</div>`
        :`<p class="hint">조건에 맞는 저장소가 없어요. 저장소 About의 Website 칸에 배포 주소를 적어 두면 자동으로 잡혀요.</p>`}</div>`}).join("")}
    <p class="hint">이미 담긴 링크는 넣은 곳·메모·썸네일을 그대로 두고 주소만 최신으로 맞춰요.</p>`;
    body.querySelector("#f-dep").addEventListener("change",e=>{f.deployOnly=e.target.checked;draw()});
    body.querySelector("#f-fork").addEventListener("change",e=>{f.hideFork=e.target.checked;draw()});
    body.querySelector("#f-arch").addEventListener("change",e=>{f.hideArch=e.target.checked;draw()});
    body.querySelectorAll("[data-rc]").forEach(x=>x.addEventListener("change",()=>{dest[x.dataset.rc]=x.value;upd()}));
    body.querySelectorAll("[data-gall]").forEach(x=>x.addEventListener("change",()=>{if(!x.value)return;const g=groups.find(y=>y.slot===x.dataset.gall);shown(g).forEach(r=>{if(!existing(r))dest[key(g,r)]=x.value});draw()}));
    body.querySelectorAll("[data-all]").forEach(b=>b.addEventListener("click",()=>{const g=groups.find(x=>x.slot===b.dataset.all);const v=shown(g);const all=v.every(r=>sel.has(key(g,r)));v.forEach(r=>all?sel.delete(key(g,r)):sel.add(key(g,r)));draw()}));
    body.querySelectorAll("[data-k]").forEach(c=>c.addEventListener("change",()=>{c.checked?sel.add(c.dataset.k):sel.delete(c.dataset.k);upd()}));
    upd();
  }
  function picked(){const out=[];(groups||[]).forEach(g=>shown(g).forEach(r=>{const k=key(g,r);if(sel.has(k))out.push({k,r})}));return out}
  function upd(){const p=picked(),fresh=p.filter(x=>!existing(x.r)),u=p.length-fresh.length;
    const ns=fresh.filter(x=>dest[x.k]!=="personal").length,np=fresh.length-ns;
    m.querySelector("#im-sum").textContent=p.length?[ns?`${catLabel("school")} ${ns}`:"",np?`${catLabel("personal")} ${np}`:"",u?`갱신 ${u}`:""].filter(Boolean).join(" · "):"";
    const go=m.querySelector("#im-go");go.disabled=!p.length;go.textContent=p.length?`${p.length}개 가져오기`:"가져오기"}
  m.querySelector("#im-reload").addEventListener("click",()=>load(true));
  m.querySelector("#im-go").addEventListener("click",()=>{
    let made=0,upd2=0;
    for(const {k,r} of picked()){
      const url=r.deploy||r.repoUrl,ex=existing(r);
      if(ex){if(ex.url!==url||(!ex.memo&&r.desc)){putLink(Object.assign({},ex,{url,memo:ex.memo||r.desc}),true);upd2++}}
      else{const nl=Object.assign({id:newId(),name:prettyName(r.name),url,memo:r.desc,links:[{label:"GitHub",url:r.repoUrl}],thumb:"",repo:r.full,pinned:false,opens:0,createdAt:Date.now()},parseDest(dest[k]));nl.icon=autoIcon(nl);putLink(nl,true);made++}
    }
    markSeen();closeModal();render();toast(made||upd2?`새로 ${made}개 추가${upd2?`, ${upd2}개 갱신`:""}했어요.`:"바뀐 게 없어요.");
  });
  load(false);
}

/* ================= 시작 ================= */
render();
if(connected())flush().then(autoCheck);else autoCheck();
})();

</script>
</body>
</html>
